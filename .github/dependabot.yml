version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: react
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Majors need manual migration work (React 19, MUI, supabase-js v2).
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: react
    schedule:
      interval: weekly
